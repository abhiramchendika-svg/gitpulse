spring:
  application:
    name: gitpulse
  config:
    # Optionally load secrets from a local .env file (KEY=value lines, never committed).
    # Checked in the backend folder and the repository root, so `./mvnw spring-boot:run`
    # works from backend/ with a .env at the repo root.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: caffeine
    # commitDetails is configured separately (24h) in CacheConfig.
    cache-names: repositories,languages,commits,commitCounts,contributors,contributorStats,pullRequests,issues,counts
    # Each cache keeps at most 500 entries for 10 minutes: fresh enough for activity data,
    # and repeated dashboard loads cost zero GitHub requests.
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

gitpulse:
  github:
    base-url: https://api.github.com
    # Empty = anonymous access (60 requests/hour). Set GITHUB_TOKEN for 5,000/hour.
    token: ${GITHUB_TOKEN:}
    api-version: "2022-11-28"
    connect-timeout: 5s
    read-timeout: 20s
  analysis:
    # 10 pages x 100 = at most 1,000 commits (10 requests) per analysis window.
    max-commit-pages: 10
    # 5 pages x 100 = 500 contributors, the most GitHub links to accounts.
    max-contributor-pages: 5
    default-window-days: 365
    max-window-days: 3650
    inactivity-threshold: 14d
    top-authors: 10
    recent-commits: 10
    inactivity-periods: 10
    contributor-limit: 100
    # Pull requests and issues are listed newest first; paging stops early once items are older
    # than the window, so these caps only matter for very busy repositories.
    max-pull-request-pages: 5
    max-issue-pages: 5
  file-activity:
    # One GitHub request per sampled commit (cached 24h by SHA). Anonymous access has only 60
    # requests per hour in total, so the sample is much smaller without a token.
    anonymous-max-sample: 20
    default-sample: 100
    max-sample: 300
    parallel-requests: 4
    list-limit: 15
  cors:
    allowed-origins: ${GITPULSE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
