name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25'] # both LTS; the code targets Java 21
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check formatting
        run: ./mvnw -B spotless:check
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gitpulse:ci .
      # Start the real image and check it serves the app, the API and its health endpoint.
      - name: Smoke test
        run: |
          docker run -d --name gitpulse -p 8080:8080 gitpulse:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/api/v1/features | grep -q '"explanations":false'
          echo "Image runs as: $(docker exec gitpulse id -un)"
          test "$(docker exec gitpulse id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs gitpulse 2>&1 | tail -50 || true
